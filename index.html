<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFT Climbing Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.communitydragon.org" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --lichen:#E9EEE6; --paper:#F7F9F4; --bark:#23302B; --bark-soft:#56655E;
  --line:#C9D3C6; --ad:#A8701A; --ad-tint:#F3E6CC; --ap:#7A4BA8; --ap-tint:#E9DEF4;
  --spore:#2E7D6B; --star:#B8860B;
  --c1:#8A938E; --c2:#1E9E6E; --c3:#2A74C2; --c4:#A13FC2; --c5:#D19A1E;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{background:var(--lichen);color:var(--bark)}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.55;background:var(--lichen)}
a{color:inherit}
img{display:block}
:focus-visible{outline:3px solid var(--spore);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Icons ---------- */
/* Champion portrait: square with a cost-colored frame, like the in-game shop. */
.pt{--s:56px;--cost:var(--c1);position:relative;flex:none;width:var(--s);height:var(--s);border-radius:10px;border:3px solid var(--cost);background:var(--bark);overflow:hidden;display:grid;place-items:center}
.pt img{width:100%;height:100%;object-fit:cover}
.pt.cost-1{--cost:var(--c1)} .pt.cost-2{--cost:var(--c2)} .pt.cost-3{--cost:var(--c3)} .pt.cost-4{--cost:var(--c4)} .pt.cost-5{--cost:var(--c5)}
.pt.none{background:var(--paper);border-style:dashed;border-color:var(--line);color:var(--bark-soft);font-family:var(--display);font-weight:800;font-size:calc(var(--s) * .38)}
.pt .fb,.it .fb,.aug .fb{font-family:var(--display);font-weight:800;color:#fff;font-size:calc(var(--s) * .34);letter-spacing:-.02em}
/* Item icon: small rounded square. */
.it{--s:26px;flex:none;width:var(--s);height:var(--s);border-radius:6px;overflow:hidden;background:var(--bark);border:1px solid rgba(0,0,0,.25);display:grid;place-items:center}
.it img{width:100%;height:100%}
.it.txt{width:auto;padding:0 8px;background:var(--paper);border-color:var(--line);font-size:12px;font-weight:700;color:var(--bark)}
.items-row{display:flex;gap:3px;flex-wrap:wrap}
.cost-key{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--bark-soft);margin:14px 0 0}
.cost-key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* ---------- Header ---------- */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;padding:28px 0 8px}
.top h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.patch{font-size:15px;color:var(--bark-soft)}
.patch strong{color:var(--bark)}

.player{display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:center;padding:18px 0 26px;border-bottom:1px solid var(--line)}
.player .who{font-family:var(--display);font-weight:700;font-size:20px}
.player .who a{text-decoration-color:var(--line);text-underline-offset:4px}
.player .who small{display:block;font-family:var(--body);font-weight:400;font-size:15px;color:var(--bark-soft)}
.player dl{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0}
.player dl div{display:flex;align-items:baseline;gap:6px}
.player dt{font-size:14px;color:var(--bark-soft)}
.player dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.leaks{grid-column:1/-1;font-size:15px;color:var(--bark-soft);margin:6px 0 0}

/* ---------- Comp picker ---------- */
.intro{padding:40px 0 18px;max-width:62ch}
.intro h2{font-family:var(--display);font-weight:800;font-size:clamp(34px,5.4vw,58px);line-height:1.02;letter-spacing:-.025em;margin:0 0 14px}
.intro p{margin:0;color:var(--bark-soft)}
.matrix{display:grid;grid-template-columns:170px 1fr 1fr;margin:18px 0 8px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.matrix .colhead{padding:14px 18px;font-size:15px;color:var(--bark-soft);border-bottom:1px solid var(--line)}
.matrix .colhead b{display:block;color:var(--bark);font-family:var(--display);font-size:16px}
.matrix .corner{border-bottom:1px solid var(--line)}
.matrix .rowhead{padding:18px;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15;display:flex;flex-direction:column;justify-content:center;gap:8px}
.matrix .rowhead small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--bark-soft)}
.row-ad{--fam:var(--ad);--tint:var(--ad-tint)}
.row-ap{--fam:var(--ap);--tint:var(--ap-tint)}
.row-ad.rowhead,.row-ap.rowhead{color:var(--fam)}
.matrix > .row-ad.rowhead,.matrix > .row-ad.cell{border-bottom:1px solid var(--line)}
.cell{appearance:none;border:0;border-left:1px solid var(--line);background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:20px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;gap:6px 16px;min-height:176px;position:relative;transition:background-color .18s}
.cell:hover{background:color-mix(in srgb,var(--tint) 55%,transparent)}
.cell[aria-pressed="true"]{background:var(--tint)}
.cell[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--fam)}
.cell .pt{--s:68px;grid-row:1/3}
.cell .name{font-family:var(--display);font-weight:700;font-size:clamp(19px,2.2vw,25px);line-height:1.08;letter-spacing:-.015em}
.cell .meta{font-size:14px;color:var(--bark-soft);align-self:start}
.cell .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:6px}
.cell .nums{display:flex;gap:16px;font-variant-numeric:tabular-nums;font-size:14px}
.cell .nums b{font-family:var(--display);font-size:21px;color:var(--fam)}
.steps{margin:22px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:s}
.steps li{counter-increment:s;font-size:15px;color:var(--bark-soft);padding-top:12px;border-top:2px solid var(--bark)}
.steps li::before{content:counter(s);display:block;font-family:var(--display);font-weight:800;font-size:20px;color:var(--bark);margin-bottom:4px}

/* ---------- Comp detail ---------- */
.comp{margin:56px 0 0;padding:34px 0 0;border-top:1px solid var(--line)}
.comp-head{display:grid;grid-template-columns:auto 1fr auto;gap:18px 28px;align-items:center}
.spot{display:flex;flex-direction:column;align-items:center;gap:8px}
.spot .pt{--s:112px;border-width:4px;border-radius:16px;box-shadow:0 0 0 4px var(--tint)}
.spot .it{--s:30px}
.spot .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fam)}
.comp-head .tag{font-size:15px;font-weight:700;color:var(--fam)}
.comp-head h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,44px);line-height:1.03;letter-spacing:-.02em;margin:4px 0 10px}
.comp-head p{margin:0;max-width:56ch}
.stat{display:flex;gap:24px}
.stat div{text-align:right}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:32px;line-height:1;color:var(--fam);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--bark-soft)}
.must{margin:24px 0 0;padding:14px 18px;border-left:5px solid var(--fam);background:var(--tint);border-radius:0 10px 10px 0;max-width:76ch}

h3{font-family:var(--display);font-weight:700;font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
.hint{margin:0 0 16px;font-size:14px;color:var(--bark-soft)}
.panel{margin-top:30px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}

/* Final board: one tile per unit, items underneath, carry highlighted. */
.board{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px 12px}
.unit{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.unit .pt{--s:72px}
.unit .alt{position:absolute;right:-8px;bottom:-8px;--s:32px;border-width:2px;border-radius:8px;box-shadow:0 0 0 2px var(--paper)}
.unit .stars{height:16px;font-size:14px;line-height:16px;color:var(--star);letter-spacing:1px}
.unit .uname{font-size:14px;line-height:1.25;font-weight:700}
.unit .uname small{display:block;font-weight:400;color:var(--bark-soft);font-size:12px}
.unit .items-row{justify-content:center;min-height:26px}
.unit.carry .pt{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--fam)}
.unit.carry .badge{position:absolute;top:10px;left:50%;transform:translate(-50%,-50%);background:var(--fam);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;z-index:1;white-space:nowrap}
.unit.carry .stars{visibility:hidden}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.grid2 > .panel{margin-top:24px}

/* Items per unit */
.builds{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.build{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding-bottom:16px;border-bottom:1px solid var(--line)}
.build:last-child{border-bottom:0;padding-bottom:0}
.build .pt{--s:48px;grid-row:1/3}
.build .who{font-weight:700}
.build .chips{display:flex;flex-wrap:wrap;gap:6px 10px;margin:4px 0}
.build .chip{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.build .chip .it{--s:28px}
.build .note{grid-column:2;font-size:14px;color:var(--bark-soft);margin:0}
.group-ico{--s:48px;width:48px;height:48px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--bark-soft);grid-row:1/3}

/* Augment priority */
.prio{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.prio li{display:flex;align-items:center;gap:8px}
.prio li span{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--lichen);font-size:14px;font-weight:700}
.prio li:first-child span{background:var(--fam);border-color:var(--fam);color:#fff}
.prio li + li::before{content:"→";color:var(--bark-soft);font-weight:700}

/* Hex board: 4 rows x 7, front row (enemy side) on top, odd rows shifted half a hex. */
.pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px 32px;align-items:start}
.hexboard{position:relative;isolation:isolate;max-width:600px;padding:22px 0 4px}
.hexboard .side{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bark-soft)}
.hexboard .side::after{content:"↑ enemy";font-weight:400;letter-spacing:0;text-transform:none}
.hexboard .side.back{position:static;margin-top:10px}
.hexboard .side.back::after{content:none}
.hrow{display:flex}
.hrow + .hrow{margin-top:-3.85%}
.hrow.odd{padding-left:6.667%}
.hex{--hexbg:#D9E1D5;position:relative;flex:none;width:13.333%;aspect-ratio:.866}
.hex::before,.hex .hin{content:"";position:absolute;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex::before{inset:3%;background:var(--hexbg)}
.hex.u{--hexbg:var(--cost)}
.hex.u::before{inset:0}
.hex.cost-1{--cost:var(--c1)} .hex.cost-2{--cost:var(--c2)} .hex.cost-3{--cost:var(--c3)} .hex.cost-4{--cost:var(--c4)} .hex.cost-5{--cost:var(--c5)}
.hex.u.none{--hexbg:var(--line)}
.hex.u.none .hin{background:var(--paper);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--bark-soft)}
.hex .hin{inset:7%;background:var(--bark);overflow:hidden}
.hex .hin img{width:100%;height:100%;object-fit:cover}
.hex .hin .fb{display:grid;place-items:center;height:100%;color:#fff;font-family:var(--display);font-weight:800}
.hex.carry{--hexbg:var(--fam)}
.hex.carry::after{content:"";position:absolute;inset:-6%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--tint);z-index:-1}
.hex .hstars{position:absolute;top:-2%;left:0;right:0;text-align:center;font-size:clamp(9px,1.3vw,13px);line-height:1;color:var(--star);text-shadow:0 0 3px #fff,0 0 3px #fff;z-index:1}
.hex .hname{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:120%;padding:1px 6px;border-radius:999px;background:rgba(35,48,43,.82);color:#fff;font-size:clamp(9px,1.15vw,12px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.hex.carry .hname{background:var(--fam)}
.hex .hitems{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;gap:2%;z-index:1}
.hex .hitems .it{--s:auto;width:27%;height:auto;aspect-ratio:1;border-radius:4px;border:1px solid #fff}
.hexboard.mini .hname,.hexboard.mini .hstars{display:none}
.hexboard.mini{padding-top:18px;max-width:none}
.hexboard.mini .side{font-size:11px}
.pos-notes{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.pos-notes li{position:relative;padding-left:26px;font-size:15px}
.pos-notes li::before{content:counter(n);counter-increment:n;position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:var(--fam);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.pos-notes{counter-reset:n}

/* Tier lists */
.tiers{display:grid;gap:10px}
.tier{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:10px;border-radius:12px;background:var(--lichen)}
.tl{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#fff}
.t-S{background:#B5402A} .t-A{background:#A06D0E} .t-B{background:#3F7F5F}
.tier ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px 8px}
.tile{width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;line-height:1.2;font-weight:700}
.tile .it{--s:40px;border-radius:8px}
.tile .it.txt{width:40px;padding:0;font-size:14px;font-family:var(--display);font-weight:800}
.tile.aug{width:86px}
.tile .ico{width:44px;height:44px;border-radius:10px;background:var(--bark);display:grid;place-items:center;overflow:hidden}
.tile .ico img{width:38px;height:38px}
.tile .ico.txt{background:var(--tint);border:2px dashed var(--fam);color:var(--fam);font-family:var(--display);font-size:16px}
.tile .rar{font-weight:400;font-size:11px;color:var(--bark-soft);display:flex;align-items:center;gap:4px}
.tile .rar::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--r)}
.rar.Silver{--r:#97A3AB} .rar.Gold{--r:#D0A626} .rar.Prismatic{--r:linear-gradient(135deg,#7FD6E8,#C59BF0,#F2B8C6)}
.tier-key{margin:12px 0 0;font-size:13px;color:var(--bark-soft)}

/* Leveling track */
.track ol{list-style:none;margin:0;padding:10px 0 0;display:flex;position:relative}
.track ol::before{content:"";position:absolute;left:18px;right:18px;top:29px;height:3px;background:var(--line)}
.track li{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative;min-width:0}
.track .lv{width:38px;height:38px;border-radius:50%;background:var(--paper);border:3px solid var(--fam);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;position:relative;z-index:1}
.track li.key .lv{background:var(--fam);color:#fff}
.track .st{font-weight:700;font-variant-numeric:tabular-nums}
.track .nt{font-size:13px;color:var(--bark-soft);padding-right:8px}
.track > p{margin:16px 0 0;font-size:15px;color:var(--bark-soft)}

/* Openers */
.op-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.op{padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--lichen)}
.op.best{border:2px solid var(--fam);background:var(--paper)}
.op h4{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 10px;display:flex;justify-content:space-between;gap:10px}
.op h4 em{font-style:normal;font-family:var(--body);font-size:12px;font-weight:700;color:#fff;background:var(--fam);padding:2px 8px;border-radius:999px;white-space:nowrap;align-self:center}
.op .faces{display:flex;gap:6px;margin:0 0 12px}
.op .faces .pt{--s:40px;border-width:2px;border-radius:8px}
.op .hexboard{margin:0 0 6px}
.op-units{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--bark-soft)}
.op dl{margin:0;display:grid;gap:8px;font-size:15px}
.op dt{font-weight:700;font-size:13px;color:var(--bark-soft)}
.op dd{margin:0}
.tip{margin:30px 0 0;font-size:18px;max-width:66ch}
.tip strong{color:var(--fam)}

/* Rules */
.rules{margin:72px 0 0;padding:40px;border-radius:22px;background:var(--bark);color:var(--lichen)}
.rules h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.6vw,40px);letter-spacing:-.02em;margin:0 0 6px}
.rules > p{margin:0 0 26px;color:#B9C6BE}
.rules ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px 34px}
.rules li strong{display:block;font-family:var(--display);font-size:19px;margin-bottom:4px;color:#fff}
.rules li span{color:#B9C6BE;font-size:15px}

footer{margin:56px 0 0;padding:26px 0 48px;border-top:1px solid var(--line);font-size:14px;color:var(--bark-soft);display:grid;grid-template-columns:1.4fr 1fr;gap:28px}
footer ul{margin:6px 0 0;padding-left:18px}
footer p{margin:0 0 8px}
.error{padding:60px 0;font-size:18px}

@media (max-width:900px){
  .comp-head{grid-template-columns:auto 1fr}
  .stat{grid-column:1/-1}
  .stat div{text-align:left}
  .grid2{grid-template-columns:1fr;gap:0}
  .pos{grid-template-columns:1fr}
}
@media (max-width:560px){
  .hex .hitems{display:none}
  .tile{width:68px}
  .tile.aug{width:76px}
  .tier{grid-template-columns:34px 1fr;gap:8px}
  .tl{width:34px;height:34px;font-size:18px;border-radius:8px}
}
@media (max-width:820px){
  .wrap{padding:0 16px}
  .matrix{grid-template-columns:1fr 1fr}
  .matrix .corner,.matrix .colhead{display:none}
  .matrix .rowhead{grid-column:1/-1;padding:14px 16px 4px;border-bottom:0!important;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .cell{border-left:0;min-height:0;padding:16px;grid-template-columns:1fr;grid-template-rows:auto}
  .cell .pt{--s:52px;grid-row:auto}
  .cell + .cell{border-left:1px solid var(--line)}
  .cell .meta::before{content:attr(data-start) " · "}
  .cell .foot{flex-direction:column;align-items:flex-start}
  .steps{grid-template-columns:1fr}
  footer{grid-template-columns:1fr}
  .player{grid-template-columns:1fr}
  .panel{padding:18px 16px}
  .spot .pt{--s:84px}
  .board{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .unit .pt{--s:62px}
  .track ol{flex-wrap:wrap;row-gap:18px}
  .track ol::before{display:none}
  .track li{flex:0 0 33%}
  .rules{padding:28px 20px}
}
@media (max-width:480px){
  .comp-head{grid-template-columns:1fr}
  .spot{flex-direction:row;align-items:center}
  .spot .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="error">Loading your plan…</p></div>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ICONS = {base:'', champions:{}, items:{}, augments:{}};
const src = p => esc(ICONS.base + p);
const initials = n => n.replace(/[^A-Za-z ]/g,'').split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0,2).toUpperCase() || '?';

// Champion names found in a free-text string, in order of appearance.
function champsIn(text){
  const names = Object.keys(ICONS.champions).sort((a,b) => b.length - a.length);
  const hits = [];
  let rest = text;
  for (const n of names){
    const re = new RegExp("(^|[^\\w'])" + n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + "(?![\\w'])");
    const m = rest.match(re);
    if (m){ hits.push([m.index, n]); rest = rest.replace(re, (all, pre) => pre + ' '.repeat(n.length)); }
  }
  return hits.sort((a,b) => a[0]-b[0]).map(h => h[1]);
}

function portrait(name, extra=''){
  const c = name && ICONS.champions[name];
  if (!c) return `<span class="pt none ${extra}" aria-hidden="true">?</span>`;
  return `<span class="pt cost-${c.cost} ${extra}" data-fb="${esc(initials(name))}"><img src="${src(c.icon)}" alt="" loading="lazy" width="72" height="72"></span>`;
}
function item(name, alt=true){
  const p = ICONS.items[name];
  if (!p) return `<span class="it txt">${esc(name)}</span>`;
  return `<span class="it" title="${esc(name)}" data-fb="${esc(initials(name))}"><img src="${src(p)}" alt="${alt ? esc(name) : ''}" loading="lazy" width="28" height="28"></span>`;
}
const itemRow = names => `<span class="items-row">${(names||[]).map(n => item(n)).join('')}</span>`;

// Items rows for a unit: "Vi / Krug" matches both Vi and Krug.
const buildFor = (c, name) => c.items.find(i => i.unit.split(/\s*\/\s*/).includes(name));
const carryItems = c => (buildFor(c, c.carry) || c.items[0]).core;

function compCell(c){
  return `<button class="cell row-${c.family}" data-id="${c.id}" aria-pressed="false" aria-controls="detail-slot">
    ${portrait(c.carry)}
    <span class="name">${esc(c.name)}</span>
    <span class="meta" data-start="${c.start === 'strong' ? 'Strong start' : 'Weak start'}">${esc(c.style)} · ${esc(c.role)} · ${esc(c.difficulty)}</span>
    <span class="foot">
      ${itemRow(carryItems(c))}
      <span class="nums"><span><b>${c.stats.avgPlace.toFixed(2)}</b> avg</span><span><b>${Math.round(c.stats.top4)}%</b> top 4</span></span>
    </span>
  </button>`;
}

function unitTile(c, entry){
  const names = champsIn(entry);
  const main = names[0];
  const stars = (entry.match(/★+/) || [''])[0];
  const label = entry.replace(/\s*★+\s*/g, ' ').trim();
  const isCarry = entry.startsWith(c.carry);
  const b = main && buildFor(c, main);
  const title = main && label.startsWith(main) ? main : label;
  const sub = title === label ? '' : label.slice(main.length).replace(/^[\s,]+/, '');
  return `<li class="unit ${isCarry ? 'carry' : ''}">
    ${isCarry ? `<span class="badge">Carry${stars ? ' ' + stars : ''}</span>` : ''}
    <span class="stars" aria-label="${stars ? stars.length + ' star' : ''}">${stars}</span>
    <span style="position:relative">${portrait(main)}${names[1] ? portrait(names[1], 'alt') : ''}</span>
    <span class="uname">${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>
    ${b ? itemRow(b.core) : '<span class="items-row"></span>'}
  </li>`;
}

function augment(name){
  const a = ICONS.augments[name] || {};
  return `<li class="tile aug">${a.icon
    ? `<span class="ico" data-fb="${esc(initials(name))}"><img src="${src(a.icon)}" alt="" loading="lazy" width="38" height="38"></span>`
    : `<span class="ico txt" aria-hidden="true">${esc(initials(name))}</span>`}${esc(name)}${a.rarity ? `<span class="rar ${esc(a.rarity)}">${esc(a.rarity)}</span>` : ''}</li>`;
}
const itemTile = name => `<li class="tile">${ICONS.items[name] ? item(name, false) : `<span class="it txt" aria-hidden="true">${esc(initials(name))}</span>`}${esc(name)}</li>`;

const TIER_TEXT = {S: 'Take first', A: 'Strong pick', B: 'Fine if nothing better'};
function tierList(tiers, tile, label){
  return `<div class="tiers">${['S','A','B'].filter(t => (tiers[t]||[]).length).map(t =>
    `<div class="tier"><span class="tl t-${t}" title="${TIER_TEXT[t]}">${t}<span class="sr"> tier: ${TIER_TEXT[t]}</span></span>
      <ul aria-label="${esc(label)}, ${t} tier">${tiers[t].map(tile).join('')}</ul></div>`).join('')}</div>
    <p class="tier-key">S: take first · A: strong pick · B: fine if nothing better shows</p>`;
}

// Hex board. units: [[label, row, col], ...]; row 0 is the front row.
function hexBoard(c, units, mini=false){
  const at = {};
  units.forEach(([label, r, col]) => { at[r + ',' + col] = label; });
  const rowNames = ['Front row', 'Second row', 'Third row', 'Back row'];
  const summary = rowNames.map((n, r) => {
    const here = units.filter(u => u[1] === r).sort((a,b) => a[2]-b[2]).map(u => u[0].replace(/\s*★+/, ''));
    return here.length ? `${n}: ${here.join(', ')}` : '';
  }).filter(Boolean).join('. ');
  const cell = label => {
    if (!label) return '<span class="hex"></span>';
    const name = champsIn(label)[0];
    const ch = name && ICONS.champions[name];
    const stars = (label.match(/★+/) || [''])[0];
    const clean = label.replace(/\s*★+/, '');
    const carry = name && name === c.carry;
    const b = !mini && name && buildFor(c, name);
    return `<span class="hex u ${ch ? 'cost-' + ch.cost : 'none'} ${carry ? 'carry' : ''}" title="${esc(clean)}">
      <span class="hin" ${ch ? `data-fb="${esc(initials(name))}"` : ''}>${ch ? `<img src="${src(ch.icon)}" alt="" loading="lazy" width="64" height="64">` : '?'}</span>
      ${stars ? `<span class="hstars">${stars}</span>` : ''}
      <span class="hname">${esc(name || clean)}</span>
      ${b ? `<span class="hitems">${b.core.map(n => item(n, false)).join('')}</span>` : ''}
    </span>`;
  };
  return `<div class="hexboard ${mini ? 'mini' : ''}" role="img" aria-label="${esc(summary)}">
    <span class="side" aria-hidden="true">Front</span>
    ${[0,1,2,3].map(r => `<div class="hrow ${r % 2 ? 'odd' : ''}" aria-hidden="true">${[0,1,2,3,4,5,6].map(col => cell(at[r + ',' + col])).join('')}</div>`).join('')}
    <span class="side back" aria-hidden="true">Back</span>
  </div>`;
}

function detail(c){
  const steps = c.leveling.steps.map(([lv, st, note]) =>
    `<li class="${note && /roll here/i.test(note) ? 'key' : ''}"><span class="lv">${esc(lv)}</span><span class="st">${esc(st)}</span>${note ? `<span class="nt">${esc(note)}</span>` : ''}</li>`).join('');
  const prio = c.augmentOrder.split(/,?\s*then\s*/i).map(s => s.trim()).filter(Boolean);
  return `<section class="comp row-${c.family}" id="detail" aria-labelledby="comp-title">
    <div class="comp-head">
      <div class="spot">
        <span class="lbl">Carry</span>
        ${portrait(c.carry)}
        ${itemRow(carryItems(c))}
      </div>
      <div>
        <span class="tag">${c.family === 'ad' ? 'AD' : 'AP'} · ${c.start === 'strong' ? 'Strong start' : 'Weak start'} · ${esc(c.style)} · ${esc(c.difficulty)}</span>
        <h2 id="comp-title">${esc(c.name)}</h2>
        <p>${esc(c.summary)}</p>
      </div>
      <div class="stat">
        <div><b>${c.stats.avgPlace.toFixed(2)}</b><span>avg place</span></div>
        <div><b>${c.stats.top4.toFixed(1)}%</b><span>top 4</span></div>
        <div><b>${c.stats.win.toFixed(1)}%</b><span>win</span></div>
      </div>
    </div>
    <p class="must"><strong>Needs:</strong> ${esc(c.mustHave)}</p>

    <div class="panel">
      <h3>Final board</h3>
      <p class="hint">Your level 8–9 board. Items sit under the unit that holds them.</p>
      <ul class="board">${c.board.map(u => unitTile(c, u)).join('')}</ul>
      <p class="cost-key" aria-label="Frame color shows unit cost">Frame = cost:
        ${[1,2,3,4,5].map(n => `<span><i style="background:var(--c${n})"></i>${n}</span>`).join('')}
      </p>
    </div>

    ${c.positioning ? `<div class="panel">
      <h3>Where to stand</h3>
      <p class="hint">Your final board placed hex by hex. The top row is closest to the enemy.</p>
      <div class="pos">
        ${hexBoard(c, c.positioning.units)}
        <ol class="pos-notes">${c.positioning.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ol>
      </div>
    </div>` : ''}

    <div class="grid2">
      <div class="panel">
        <h3>Items</h3>
        <p class="hint">Build these first. The note says what else works.</p>
        <ul class="builds">${c.items.map(i => {
          const who = champsIn(i.unit)[0];
          return `<li class="build">
            ${who ? portrait(who) : `<span class="group-ico" aria-hidden="true">${esc(initials(i.unit))}</span>`}
            <span class="who">${esc(i.unit)}</span>
            <div>
              <span class="chips">${(i.core||[]).map(n => `<span class="chip">${item(n, false)}${esc(n)}</span>`).join('')}</span>
              <p class="note">${esc(i.build)}</p>
            </div>
          </li>`; }).join('')}</ul>
      </div>
      <div class="panel">
        <h3>Item tiers</h3>
        <p class="hint">Which items to grab from carousels and anvils for this comp.</p>
        ${tierList(c.itemTiers || {}, itemTile, 'Items')}
      </div>
    </div>

    <div class="panel">
      <h3>Augment tiers</h3>
      <p class="hint">The best augments for this comp. The colored tag shows the augment's rarity.</p>
      ${tierList(c.augmentTiers || {}, augment, 'Augments')}
      <h3 style="margin-top:24px">When nothing above shows up</h3>
      <p class="hint">Pick by type in this order.</p>
      <ol class="prio" aria-label="Augment priority, most important first">${prio.map(p => `<li><span>${esc(p[0].toUpperCase() + p.slice(1))}</span></li>`).join('')}</ol>
    </div>

    <div class="panel track">
      <h3>When to level · ${esc(c.leveling.label)}</h3>
      <p class="hint">Level on these stages. A filled circle means roll down here.</p>
      <ol aria-label="Level by stage">${steps}</ol>
      <p>${esc(c.leveling.note)}</p>
    </div>

    <div class="panel">
      <h3>Best openers</h3>
      <p class="hint">How to play stage 2 so you arrive with the right items. Each board shows a suggested setup: tanks in front, ranged units in the back.</p>
      <div class="op-list">${c.openers.map(o => {
        const faces = o.positioning ? [] : champsIn(o.board);
        return `<article class="op ${o.best ? 'best' : ''}">
        <h4>${esc(o.name)}${o.best ? '<em>Best</em>' : ''}</h4>
        ${o.positioning ? hexBoard(c, o.positioning, true) + `<p class="op-units">${o.positioning.map(u => esc(u[0])).join(' · ')}</p>` : ''}
        ${faces.length ? `<div class="faces">${faces.map(f => portrait(f)).join('')}</div>` : ''}
        <dl><div><dt>Stage 2 board</dt><dd>${esc(o.board)}</dd></div>
        <div><dt>First slam</dt><dd>${esc(o.slam)}</dd></div>
        <div><dt>Take it when</dt><dd>${esc(o.when)}</dd></div></dl>
      </article>`; }).join('')}</div>
    </div>

    <p class="tip"><strong>Tip:</strong> ${esc(c.tip)}</p>
  </section>`;
}

function render(d){
  ICONS = Object.assign(ICONS, d.icons || {});
  const byKey = (fam, start) => d.comps.find(c => c.family === fam && c.start === start);
  const p = d.player;
  const row = fam => {
    const f = d.families.find(x => x.id === fam);
    return `<div class="rowhead row-${fam}">${esc(f.name)}${itemRow(f.slamItems)}<small>${esc(f.slams)}</small></div>
      ${compCell(byKey(fam,'strong'))}${compCell(byKey(fam,'weak'))}`;
  };
  document.getElementById('app').innerHTML = `
  <header class="top">
    <h1>TFT Climbing Plan</h1>
    <span class="patch">Set ${esc(d.set)} ${esc(d.setName)} · <strong>Patch ${esc(d.patch)}</strong> · updated ${esc(d.updated)}</span>
  </header>
  <section class="player" aria-label="Your profile">
    <div class="who"><a href="${esc(p.profileUrl)}" target="_blank" rel="noopener">${esc(p.name)}</a><small>${esc(p.rank)} · ${esc(p.region)}</small></div>
    <dl>
      <div><dt>Games</dt><dd>${p.games}</dd></div>
      <div><dt>Avg place</dt><dd>${p.avgPlace}</dd></div>
      <div><dt>Top 4</dt><dd>${p.top4Rate}%</dd></div>
      <div><dt>Wins</dt><dd>${p.winRate}%</dd></div>
    </dl>
    <p class="leaks">What to fix: ${p.leaks.map(esc).join('; ')}.</p>
  </section>

  <section class="intro">
    <h2>Four comps. Your first item picks the row.</h2>
    <p>Play only these until you leave Emerald. Each row shares items, so you can switch between its two comps mid-game without wasting anything. Pick a comp to see its board.</p>
  </section>
  <div class="matrix" role="group" aria-label="Pick a comp">
    <div class="corner"></div>
    <div class="colhead"><b>Strong start</b>Win streak, healthy</div>
    <div class="colhead"><b>Weak start</b>Losing, low HP or contested</div>
    ${row('ad')}${row('ap')}
  </div>
  <ol class="steps">${d.pickSteps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>

  <div id="detail-slot" aria-live="polite"></div>

  <section class="rules">
    <h2>Your five rules</h2>
    <p>These target the two leaks on your profile: busting to 8th and spending gold too early.</p>
    <ul>${d.rules.map(r => `<li><strong>${esc(r.title)}</strong><span>${esc(r.detail)}</span></li>`).join('')}</ul>
  </section>

  <footer>
    <div>
      <p>Comp stats: ${esc(d.dataWindow)}. ${esc(d.nextChange)}</p>
      <p>TFT Climbing Plan isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games or anyone officially involved in producing or managing Riot Games properties. Riot Games and all associated properties are trademarks or registered trademarks of Riot Games, Inc. Game images via CommunityDragon.</p>
    </div>
    <div>Sources<ul>${d.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>: ${esc(s.used)}</li>`).join('')}</ul></div>
  </footer>`;

  const select = id => {
    const c = d.comps.find(x => x.id === id) || d.comps[0];
    document.querySelectorAll('.cell').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === c.id)));
    document.getElementById('detail-slot').innerHTML = detail(c);
    return c;
  };
  document.querySelectorAll('.cell').forEach(b => b.addEventListener('click', () => {
    select(b.dataset.id);
    history.replaceState(null, '', '#' + b.dataset.id);
    document.getElementById('detail').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
  }));
  select(location.hash.slice(1));
}

// If an image fails to load, show initials instead of a broken icon.
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG') return;
  const box = img.parentElement;
  box.innerHTML = `<span class="fb">${esc(box.dataset.fb || '?')}</span>`;
}, true);

fetch('data/meta.json', {cache: 'no-cache'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(err => { console.error(err); document.getElementById('app').innerHTML = '<p class="error">The comp data didn\'t load. Refresh the page; if it still fails, check that data/meta.json is in the repo.</p>'; });
</script>
</body>
</html>
